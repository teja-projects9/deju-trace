# ---------------------------------------------------------------------------
# Central version pinning. Keep dependencies on recent, CVE-free releases; the
# plugin is intended for the JetBrains Marketplace where the Plugin Verifier and
# marketplace scanners flag known-vulnerable transitive dependencies.
# ---------------------------------------------------------------------------

# Product / plugin coordinates
#
# The version suffix selects the Marketplace channel (see plugin/build.gradle.kts):
#   1.1.0        -> default channel, the public listing
#   1.1.0-eap.1  -> "eap" channel, installed only by users who add it
pluginGroup = org.deju
pluginVersion = 2.0.1

# Local build toolchain (reproducible builds use a pinned JDK).
javaToolchainVersion = 21

# Agent must remain runnable on any Java 11+ target VM.
agentReleaseVersion = 11

# --- IntelliJ Platform ------------------------------------------------------
# Supported range: IntelliJ IDEA 2024.1 (241) and every newer version.
# We COMPILE against the OLDEST supported platform so the compiler prevents us from
# using an API that would be missing on 2024.1; newer IDEs stay compatible because
# untilBuild is left open (see plugin/build.gradle.kts).
intellijPlatformType = IC
intellijPlatformVersion = 2024.1.7
pluginSinceBuild = 241

# IntelliJ 2024.1 still runs on JBR 17, so plugin bytecode must be Java 17 to load
# there. (2024.2+ run on JDK 21, which happily loads 17.)
pluginTargetJavaVersion = 17

# --- Third-party libraries (pinned) ----------------------------------------
# ByteBuddy 1.17.x reads Java 8..24 classfiles (covers Java 11 -> 21+ targets).
byteBuddyVersion = 1.17.5
# Jackson 2.18.x, recent, no open critical CVEs; default typing stays disabled.
jacksonVersion = 2.18.2
# Spring Boot for the traced employee-api target application.
springBootVersion = 3.4.1

# Gradle daemon niceties
org.gradle.parallel = true
org.gradle.caching = true
kotlin.stdlib.default.dependency = false
